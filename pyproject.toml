[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-probability-baseball"
version = "1.0.0"
description = "Validated Statcast feature preparation and swing-probability baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
analysis = [
  "jupyter>=1.0",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "pybaseball>=2.2.7",
  "scikit-optimize>=0.10",
  "shap>=0.45",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["swing_probability*"]
